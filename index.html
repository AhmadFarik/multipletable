<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جداول الضرب 1-10 | تدريب ممتع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* إنفوجرافيك رياضي - خلفية */
        .math-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .math-symbol {
            position: absolute;
            font-size: 3rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.08);
            animation: floatSymbol 15s infinite ease-in-out;
            user-select: none;
        }

        @keyframes floatSymbol {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }

        /* ألوان الأرقام */
        .math-symbol:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; font-size: 5rem; color: rgba(255, 215, 0, 0.1); }
        .math-symbol:nth-child(2) { top: 15%; left: 85%; animation-delay: 2s; font-size: 4rem; color: rgba(255, 99, 132, 0.1); }
        .math-symbol:nth-child(3) { top: 70%; left: 10%; animation-delay: 4s; font-size: 6rem; color: rgba(54, 162, 235, 0.08); }
        .math-symbol:nth-child(4) { top: 80%; left: 75%; animation-delay: 1s; font-size: 4.5rem; color: rgba(255, 206, 86, 0.1); }
        .math-symbol:nth-child(5) { top: 40%; left: 50%; animation-delay: 3s; font-size: 7rem; color: rgba(153, 102, 255, 0.06); }
        .math-symbol:nth-child(6) { top: 55%; left: 25%; animation-delay: 5s; font-size: 3.5rem; color: rgba(75, 192, 192, 0.1); }
        .math-symbol:nth-child(7) { top: 10%; left: 45%; animation-delay: 2.5s; font-size: 4rem; color: rgba(255, 159, 64, 0.1); }
        .math-symbol:nth-child(8) { top: 90%; left: 40%; animation-delay: 6s; font-size: 5rem; color: rgba(255, 99, 132, 0.08); }
        .math-symbol:nth-child(9) { top: 30%; left: 15%; animation-delay: 1.5s; font-size: 3rem; color: rgba(54, 162, 235, 0.1); }
        .math-symbol:nth-child(10) { top: 65%; left: 90%; animation-delay: 4.5s; font-size: 4.5rem; color: rgba(255, 215, 0, 0.08); }

        /* دوائر ملونة في الخلفية */
        .circle-bg {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: pulseCircle 8s infinite ease-in-out;
        }

        .circle-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #ff6b6b, transparent);
            top: -100px; right: -100px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #4ecdc4, transparent);
            bottom: -150px; left: -150px;
            animation-delay: 3s;
        }

        .circle-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #ffe66d, transparent);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 5s;
        }

        @keyframes pulseCircle {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.3); opacity: 0.08; }
        }

        .app-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            box-shadow: 
                0 30px 60px rgba(0, 20, 50, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.5),
                inset 0 0 80px rgba(102, 126, 234, 0.05);
            padding: 35px;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        /* الترويسة */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 4px dashed;
            border-image: linear-gradient(90deg, #667eea, #764ba2, #f093fb) 1;
        }

        .title-section h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .title-section h1 i {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.8rem;
            filter: drop-shadow(0 4px 6px rgba(240, 147, 251, 0.3));
        }

        .teacher-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 
                0 8px 0 #4a3f8a,
                0 12px 20px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .teacher-badge:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 0 #4a3f8a,
                0 15px 25px rgba(102, 126, 234, 0.4);
        }

        .teacher-badge i {
            color: #ffe66d;
            font-size: 1.4rem;
        }

        /* الأزرار الرئيسية */
        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn {
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            background: white;
            color: #1e3b5a;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 6px 0 #4a3f8a, 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 6px 0 #c0392b, 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #1e3b5a;
            box-shadow: 0 6px 0 #2d9e5a, 0 10px 20px rgba(67, 233, 123, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 rgba(0, 0, 0, 0.15), 0 15px 25px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            cursor: not-allowed;
        }

        /* بطاقة السؤال */
        .quiz-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240, 245, 255, 0.95));
            border-radius: 40px;
            padding: 35px 25px;
            box-shadow: 
                0 20px 40px rgba(102, 126, 234, 0.15),
                inset 0 1px 5px rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .quiz-card::before {
            content: '✏️';
            position: absolute;
            top: -15px;
            right: 30px;
            font-size: 2rem;
            background: white;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* حاوية أسئلة متراكمة */
        .questions-stack {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .question-block {
            text-align: center;
            padding-bottom: 22px;
            border-bottom: 2px dashed #d7e6f8;
            animation: slideIn 0.3s ease;
            transition: all 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .question-text {
            font-size: 1.4rem;
            color: #5a6c8a;
            margin-bottom: 14px;
            font-weight: 600;
        }

        /* السؤال الأحدث (النشط) */
        .question-block.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(240, 147, 251, 0.05));
            border-radius: 30px;
            padding: 25px 15px;
            border: 2px solid rgba(102, 126, 234, 0.15);
        }

        .question-block.active .question-text {
            font-size: 1.8rem;
            color: #4a3f8a;
        }

        .big-equation {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0 18px;
            display: inline-block;
            line-height: 1.3;
            letter-spacing: 3px;
            filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.2));
        }

        .question-block.active .big-equation {
            font-size: 4.5rem;
            letter-spacing: 5px;
            animation: glowEquation 2s infinite alternate;
        }

        @keyframes glowEquation {
            from { filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.2)); }
            to { filter: drop-shadow(0 8px 16px rgba(240, 147, 251, 0.4)); }
        }

        .big-equation span {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 15px;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px;
        }

        .answer-input {
            font-size: 1.6rem;
            width: 180px;
            padding: 12px 20px;
            border: 4px solid #e0e8f5;
            border-radius: 80px;
            text-align: center;
            font-weight: 700;
            color: #2c3e50;
            background: #ffffff;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }

        .question-block.active .answer-input {
            font-size: 2rem;
            width: 220px;
            padding: 15px 25px;
            border-color: #667eea;
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.05),
                0 0 0 5px rgba(102, 126, 234, 0.15);
        }

        .answer-input:focus {
            border-color: #764ba2;
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.05),
                0 0 0 6px rgba(118, 75, 162, 0.2);
            transform: scale(1.02);
        }

        .answer-input:disabled {
            background: #f3f7fb;
            color: #a0b3c9;
            border-color: #d0dceb;
        }

        .submit-btn {
            padding: 12px 28px;
            font-size: 1.1rem;
        }

        .question-block.active .submit-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
        }

        .feedback {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 14px;
            min-height: 2.6rem;
            padding: 8px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .question-block.active .feedback {
            font-size: 1.6rem;
            min-height: 3.2rem;
        }

        .feedback.correct {
            color: #1e7e34;
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.1), rgba(56, 249, 215, 0.1));
            animation: bounceIn 0.5s ease;
        }

        .feedback.wrong {
            color: #c12b2b;
            background: linear-gradient(135deg, rgba(245, 87, 108, 0.1), rgba(240, 147, 251, 0.1));
            animation: shake 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.2rem;
            flex-wrap: wrap;
        }

        .stats span {
            background: linear-gradient(135deg, #f8f9ff, #eef1ff);
            padding: 12px 25px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.1);
            transition: transform 0.2s;
        }

        .stats span:hover {
            transform: translateY(-2px);
        }

        .stats i {
            font-size: 1.3rem;
        }

        .stat-correct i { color: #43e97b; }
        .stat-wrong i { color: #f5576c; }

        /* قسم الجداول */
        .tables-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248, 250, 255, 0.98));
            border-radius: 40px;
            padding: 30px;
            margin-top: 25px;
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .tables-section::before {
            content: '📊';
            position: absolute;
            top: -15px;
            left: 30px;
            font-size: 2rem;
            background: white;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 8px solid;
            border-image: linear-gradient(180deg, #667eea, #f093fb) 1;
            padding-right: 20px;
        }

        .section-title i {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            border-radius: 25px;
            padding: 15px 12px;
            border: 2px solid #eef1ff;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .table-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
        }

        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.15);
        }

        .table-card h3 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 1.4rem;
            margin-bottom: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .table-lines {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 500;
        }

        .table-lines div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px dashed #e0e8f5;
            transition: background 0.2s;
            border-radius: 10px;
        }

        .table-lines div:hover {
            background: #f8faff;
        }

        .table-lines div:last-child {
            border-bottom: none;
        }

        .table-lines .result {
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }

        /* تذييل */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 1rem;
            color: #5a6c8a;
            font-weight: 600;
            padding: 15px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(240, 147, 251, 0.05));
        }

        .footer i {
            color: #f5576c;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .hidden {
            display: none !important;
        }

        /* للطباعة */
        @media print {
            @page {
                size: A4 landscape;
                margin: 8mm;
            }
            html, body {
                background: white;
                padding: 0;
                height: auto;
            }
            .math-bg, .circle-bg {
                display: none !important;
            }
            .app-container {
