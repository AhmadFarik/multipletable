<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جداول الضرب 1-10 | تدريب ممتع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* إنفوجرافيك رياضي - خلفية */
        .math-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .math-symbol {
            position: absolute;
            font-size: 3rem;
            font-weight: 800;
            animation: floatSymbol 15s infinite ease-in-out;
            user-select: none;
        }

        @keyframes floatSymbol {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }

        .math-symbol:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; font-size: 5rem; color: rgba(255, 215, 0, 0.15); }
        .math-symbol:nth-child(2) { top: 15%; left: 85%; animation-delay: 2s; font-size: 4rem; color: rgba(255, 99, 132, 0.15); }
        .math-symbol:nth-child(3) { top: 70%; left: 10%; animation-delay: 4s; font-size: 6rem; color: rgba(54, 162, 235, 0.12); }
        .math-symbol:nth-child(4) { top: 80%; left: 75%; animation-delay: 1s; font-size: 4.5rem; color: rgba(255, 206, 86, 0.15); }
        .math-symbol:nth-child(5) { top: 40%; left: 50%; animation-delay: 3s; font-size: 7rem; color: rgba(153, 102, 255, 0.1); }
        .math-symbol:nth-child(6) { top: 55%; left: 25%; animation-delay: 5s; font-size: 3.5rem; color: rgba(75, 192, 192, 0.15); }
        .math-symbol:nth-child(7) { top: 10%; left: 45%; animation-delay: 2.5s; font-size: 4rem; color: rgba(255, 159, 64, 0.15); }
        .math-symbol:nth-child(8) { top: 90%; left: 40%; animation-delay: 6s; font-size: 5rem; color: rgba(255, 99, 132, 0.12); }
        .math-symbol:nth-child(9) { top: 30%; left: 15%; animation-delay: 1.5s; font-size: 3rem; color: rgba(54, 162, 235, 0.15); }
        .math-symbol:nth-child(10) { top: 65%; left: 90%; animation-delay: 4.5s; font-size: 4.5rem; color: rgba(255, 215, 0, 0.12); }

        .circle-bg {
            position: absolute;
            border-radius: 50%;
            opacity: 0.2;
            animation: pulseCircle 8s infinite ease-in-out;
        }

        .circle-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #ff6b6b, transparent);
            top: -100px; right: -100px;
        }

        .circle-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #4ecdc4, transparent);
            bottom: -150px; left: -150px;
            animation-delay: 3s;
        }

        .circle-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #ffe66d, transparent);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 5s;
        }

        @keyframes pulseCircle {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.3); opacity: 0.1; }
        }

        .app-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            box-shadow: 
                0 30px 60px rgba(0, 20, 50, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.5),
                inset 0 0 80px rgba(102, 126, 234, 0.05);
            padding: 35px;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        /* الترويسة */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 4px dashed;
            border-image: linear-gradient(90deg, #667eea, #764ba2, #f093fb) 1;
        }

        .title-section h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .title-section h1 i {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.8rem;
            filter: drop-shadow(0 4px 6px rgba(240, 147, 251, 0.3));
        }

        .teacher-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 
                0 8px 0 #4a3f8a,
                0 12px 20px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .teacher-badge:hover {
            transform: translateY(-2px);
        }

        .teacher-badge i {
            color: #ffe66d;
            font-size: 1.4rem;
        }

        /* الأزرار الرئيسية */
        .nav-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            background: white;
            color: #1e3b5a;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 6px 0 #4a3f8a, 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 6px 0 #c0392b, 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #1e3b5a;
            box-shadow: 0 6px 0 #2d9e5a, 0 10px 20px rgba(67, 233, 123, 0.3);
        }

        .btn-light {
            background: #e9f0fa;
            color: #4a3f8a;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            cursor: not-allowed;
        }

        /* بطاقة السؤال */
        .quiz-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(240, 245, 255, 0.98));
            border-radius: 40px;
            padding: 35px 25px;
            box-shadow: 
                0 20px 40px rgba(102, 126, 234, 0.15),
                inset 0 1px 5px rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .quiz-card::before {
            content: '✏️';
            position: absolute;
            top: -15px;
            right: 30px;
            font-size: 2rem;
            background: white;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .questions-stack {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .question-block {
            text-align: center;
            padding-bottom: 22px;
            border-bottom: 2px dashed #d7e6f8;
            animation: slideIn 0.3s ease;
        }

        .question-block:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .question-text {
            font-size: 1.4rem;
            color: #5a6c8a;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .question-block.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(240, 147, 251, 0.05));
            border-radius: 30px;
            padding: 25px 15px;
            border: 2px solid rgba(102, 126, 234, 0.15);
        }

        .question-block.active .question-text {
            font-size: 1.8rem;
            color: #4a3f8a;
        }

        .big-equation {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0 18px;
            display: inline-block;
            line-height: 1.3;
            letter-spacing: 3px;
        }

        .question-block.active .big-equation {
            font-size: 4.5rem;
            letter-spacing: 5px;
            animation: glowEquation 2s infinite alternate;
        }

        @keyframes glowEquation {
            from { filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.2)); }
            to { filter: drop-shadow(0 8px 16px rgba(240, 147, 251, 0.4)); }
        }

        .big-equation span {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 15px;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px;
        }

        .answer-input {
            font-size: 1.6rem;
            width: 180px;
            padding: 12px 20px;
            border: 4px solid #e0e8f5;
            border-radius: 80px;
            text-align: center;
            font-weight: 700;
            color: #2c3e50;
            background: #ffffff;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        .question-block.active .answer-input {
            font-size: 2rem;
            width: 220px;
            padding: 15px 25px;
            border-color: #667eea;
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.05),
                0 0 0 5px rgba(102, 126, 234, 0.15);
        }

        .answer-input:focus {
            border-color: #764ba2;
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.05),
                0 0 0 6px rgba(118, 75, 162, 0.2);
            transform: scale(1.02);
        }

        .answer-input:disabled {
            background: #f3f7fb;
            color: #a0b3c9;
            border-color: #d0dceb;
        }

        /* حاوية أزرار التحقق والسؤال الجديد */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .submit-btn {
            padding: 12px 28px;
            font-size: 1.1rem;
        }

        .question-block.active .submit-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
        }

        .new-question-btn {
            padding: 12px 28px;
            font-size: 1.1rem;
        }

        .question-block.active .new-question-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
        }

        .feedback {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 14px;
            min-height: 2.6rem;
            padding: 8px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .question-block.active .feedback {
            font-size: 1.6rem;
            min-height: 3.2rem;
        }

        .feedback.correct {
            color: #1e7e34;
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.1), rgba(56, 249, 215, 0.1));
            animation: bounceIn 0.5s ease;
        }

        .feedback.wrong {
            color: #c12b2b;
            background: linear-gradient(135deg, rgba(245, 87, 108, 0.1), rgba(240, 147, 251, 0.1));
            animation: shake 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.2rem;
            flex-wrap: wrap;
        }

        .stats span {
            background: linear-gradient(135deg, #f8f9ff, #eef1ff);
            padding: 12px 25px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.1);
            transition: transform 0.2s;
        }

        .stats span:hover {
            transform: translateY(-2px);
        }

        .stats i {
            font-size: 1.3rem;
        }

        .stat-correct i { color: #43e97b; }
        .stat-wrong i { color: #f5576c; }

        /* قسم الجداول */
        .tables-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(248, 250, 255, 0.98));
            border-radius: 40px;
            padding: 30px;
            margin-top: 25px;
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        .tables-section::before {
            content: '📊';
            position: absolute;
            top: -15px;
            left: 30px;
            font-size: 2rem;
            background: white;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-right: 8px solid;
            border-image: linear-gradient(180deg, #667eea, #f093fb) 1;
            padding-right: 20px;
            flex-wrap: wrap;
        }

        .section-title i {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            border-radius: 25px;
            padding: 15px 12px;
            border: 2px solid #eef1ff;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .table-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
        }

        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.15);
        }

        .table-card h3 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 1.4rem;
            margin-bottom: 14px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .table-lines {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 500;
        }

        .table-lines div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px dashed #e0e8f5;
            transition: background 0.2s;
            border-radius: 10px;
        }

        .table-lines div:hover {
            background: #f8faff;
        }

        .table-lines div:last-child {
            border-bottom: none;
        }

        .table-lines .result {
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 1rem;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }

        /* تذييل */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 1rem;
            color: #5a6c8a;
            font-weight: 600;
            padding: 15px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(240, 147, 251, 0.05));
        }

        .footer i {
            color: #f5576c;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .hidden {
            display: none !important;
        }

        /* للطباعة */
        @media print {
            @page {
                size: A4 landscape;
                margin: 8mm;
            }
            html, body {
                background: white;
                padding: 0;
                height: auto;
            }
            .math-bg, .circle-bg {
                display: none !important;
            }
            .app-container {
                box-shadow: none;
                background: white;
                padding: 0;
                border-radius: 0;
                max-width: 100%;
                border: none;
            }
            .nav-buttons, .quiz-card, .btn, .header .teacher-badge, .footer,
            .section-title span, .tables-section p {
                display: none !important;
            }
            .header {
                margin-bottom: 8px;
                padding-bottom: 6px;
                border-bottom: 1px solid #000;
            }
            .title-section h1 {
                font-size: 1.1rem;
                color: #000;
                -webkit-text-fill-color: #000;
                background: none;
            }
            .title-section h1 i { display: none; }
            .title-section p { display: none; }
            .tables-section {
                box-shadow: none;
                padding: 0;
                margin: 4px 0 0 0;
                background: white;
                border: none;
            }
            .tables-section::before { display: none; }
            .section-title {
                font-size: 1rem;
                color: #000;
                border-right-color: #000;
                margin-bottom: 6px;
                padding-right: 8px;
            }
            .tables-grid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(2, auto);
                gap: 4mm;
                width: 100%;
            }
            .table-card {
                break-inside: avoid;
                border: 1px solid #999;
                background: #fff;
                padding: 4px 3px;
                border-radius: 6px;
                box-shadow: none;
            }
            .table-card::before { display: none; }
            .table-card h3 {
                background: #e0e0e0;
                color: #000;
                font-size: 0.72rem;
                padding: 2px 10px;
                margin-bottom: 4px;
                border-radius: 20px;
                box-shadow: none;
            }
            .table-lines {
                gap: 0;
                font-size: 0.62rem;
            }
            .table-lines div {
                padding: 1px 4px;
                border-bottom: none;
            }
            .table-lines .result {
                font-weight: 700;
                background: transparent;
                color: #000;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* استجابة للشاشات الصغيرة */
        @media (max-width: 768px) {
            .app-container {
                padding: 20px;
                border-radius: 30px;
            }
            .title-section h1 {
                font-size: 1.6rem;
            }
            .teacher-badge {
                font-size: 1rem;
                padding: 10px 20px;
            }
            .question-block.active .big-equation {
                font-size: 3rem;
            }
            .question-block.active .answer-input {
                width: 160px;
                font-size: 1.5rem;
            }
            .tables-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .nav-buttons {
                justify-content: center;
            }
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- إنفوجرافيك رياضي في الخلفية -->
    <div class="math-bg">
        <div class="math-symbol">×</div>
        <div class="math-symbol">÷</div>
        <div class="math-symbol">+</div>
        <div class="math-symbol">=</div>
        <div class="math-symbol">π</div>
        <div class="math-symbol">√</div>
        <div class="math-symbol">∑</div>
        <div class="math-symbol">∞</div>
        <div class="math-symbol">%</div>
        <div class="math-symbol">≠</div>
        <div class="circle-bg circle-1"></div>
        <div class="circle-bg circle-2"></div>
        <div class="circle-bg circle-3"></div>
    </div>

    <div class="app-container">
        <!-- الترويسة -->
        <div class="header">
            <div class="title-section">
                <h1>
                    <i class="fas fa-calculator"></i>
                    جداول الضرب ١-١٠
                </h1>
                <p style="font-size: 1.1rem; color: #764ba2; font-weight: 500; margin-top: 8px;">
                    <i class="fas fa-graduation-cap"></i> تدريب مستمر لحفظ جداول الضرب
                </p>
            </div>
            <div class="teacher-badge">
                <i class="fas fa-chalkboard-teacher"></i>
                إعداد المعلم أحمد فرخ
            </div>
        </div>

        <!-- أزرار التنقل -->
        <div class="nav-buttons">
            <button class="btn btn-secondary" id="showTablesBtn">
                <i class="fas fa-table"></i> عرض الجداول كاملة
            </button>
            <button class="btn btn-light" id="downloadTablesBtn">
                <i class="fas fa-download"></i> تحميل الجداول (PDF)
            </button>
            <button class="btn btn-light" id="clearQuestionsBtn">
                <i class="fas fa-eraser"></i> مسح الأسئلة السابقة
            </button>
        </div>

        <!-- بطاقة السؤال والجواب -->
        <div class="quiz-card" id="quizCard">
            <div class="questions-stack" id="questionsStack">
                <!-- تُضاف بطاقات الأسئلة هنا بواسطة JavaScript -->
            </div>
            <div class="stats">
                <span class="stat-correct"><i class="fas fa-star"></i> صحيحة: <span id="correctCount">0</span></span>
                <span class="stat-wrong"><i class="fas fa-times-circle"></i> خاطئة: <span id="wrongCount">0</span></span>
            </div>
        </div>

        <!-- قسم الجداول -->
        <div class="tables-section hidden" id="tablesSection">
            <div class="section-title">
                <i class="fas fa-list-ol"></i>
                جداول الضرب من ١ إلى ١٠ مع الإجابات
                <span style="font-size: 0.9rem; background: linear-gradient(135deg, #f093fb, #f5576c); padding: 5px 15px; border-radius: 30px; color: white;">مرتبة ومنظمة</span>
            </div>
            <div class="tables-grid" id="tablesGrid">
                <!-- سيتم توليد الجداول بواسطة JavaScript -->
            </div>
            <p style="text-align: center; margin-top: 20px; color: #5a6c8a;">
                <i class="fas fa-print"></i> يمكنك طباعة هذه الصفحة أو حفظها كـ PDF
            </p>
        </div>

        <!-- تذييل -->
        <div class="footer">
            <i class="fas fa-heart"></i> تدريب ممتع لطلاب الصف الخامس الأساسي <i class="fas fa-heart"></i>
            <br>جميع الحقوق محفوظة © المعلم أحمد فرخ
        </div>
    </div>

    <script>
        (function() {
            // عناصر DOM
            const questionsStack = document.getElementById('questionsStack');
            const clearQuestionsBtn = document.getElementById('clearQuestionsBtn');
            const correctSpan = document.getElementById('correctCount');
            const wrongSpan = document.getElementById('wrongCount');
            const showTablesBtn = document.getElementById('showTablesBtn');
            const downloadTablesBtn = document.getElementById('downloadTablesBtn');
            const tablesSection = document.getElementById('tablesSection');
            const tablesGrid = document.getElementById('tablesGrid');

            // متغيرات الحالة
            let correctAnswers = 0;
            let wrongAnswers = 0;
            let questionCounter = 0;

            // تهيئة الجداول
            function generateTablesHTML() {
                let html = '';
                for (let i = 1; i <= 10; i++) {
                    html += `<div class="table-card">`;
                    html += `<h3>جدول ${i}</h3>`;
                    html += `<div class="table-lines">`;
                    for (let j = 1; j <= 10; j++) {
                        html += `<div><span>${i} × ${j}</span><span class="result">${i * j}</span></div>`;
                    }
                    html += `</div></div>`;
                }
                return html;
            }

            // ملء الجداول عند التحميل
            tablesGrid.innerHTML = generateTablesHTML();

            // إضافة سؤال جديد
            function addNewQuestion() {
                // تعطيل السؤال النشط السابق
                const prevActive = questionsStack.querySelector('.question-block.active');
                if (prevActive) {
                    prevActive.classList.remove('active');
                    const prevInput = prevActive.querySelector('.answer-input');
                    if (prevInput) prevInput.disabled = true;
                    const prevSubmitBtn = prevActive.querySelector('.submit-btn');
                    if (prevSubmitBtn) prevSubmitBtn.disabled = true;
                    const prevNewBtn = prevActive.querySelector('.new-question-btn');
                    if (prevNewBtn) prevNewBtn.disabled = true;
                }

                const num1 = Math.floor(Math.random() * 10) + 1;
                const num2 = Math.floor(Math.random() * 10) + 1;
                const correctAnswer = num1 * num2;
                questionCounter++;

                const block = document.createElement('div');
                block.className = 'question-block active';
                block.dataset.answer = correctAnswer;
                block.innerHTML = `
                    <div class="question-text">
                        <i class="fas fa-question-circle" style="color: #f5576c;"></i>
                        ما هو ناتج ضرب
                    </div>
                    <div class="big-equation">${num1} <span>×</span> ${num2}</div>
                    <div class="answer-input-area">
                        <input type="number" class="answer-input" placeholder="؟" min="0" max="150" inputmode="numeric">
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary submit-btn">
                            <i class="fas fa-check-circle"></i> تحقق
                        </button>
                        <button class="btn btn-success new-question-btn">
                            <i class="fas fa-dice"></i> سؤال جديد
                        </button>
                    </div>
                    <div class="feedback"></div>
                `;

                questionsStack.appendChild(block);

                const input = block.querySelector('.answer-input');
                const submitBtn = block.querySelector('.submit-btn');
                const newBtn = block.querySelector('.new-question-btn');
                const feedbackDiv = block.querySelector('.feedback');

                // التركيز التلقائي على الإدخال
                setTimeout(() => input.focus(), 100);

                function checkAnswer() {
                    const userAnswer = parseInt(input.value.trim(), 10);
                    if (isNaN(userAnswer)) {
                        feedbackDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> الرجاء إدخال رقم صحيح';
                        feedbackDiv.classList.add('wrong');
                        feedbackDiv.classList.remove('correct');
                        return;
                    }

                    if (userAnswer === correctAnswer) {
                        correctAnswers++;
                        correctSpan.textContent = correctAnswers;
                        feedbackDiv.innerHTML = '<i class="fas fa-check-circle"></i> أحسنت! الإجابة صحيحة 🌟';
                        feedbackDiv.classList.remove('wrong');
                        feedbackDiv.classList.add('correct');
                        input.disabled = true;
                        submitBtn.disabled = true;
                        newBtn.disabled = true;
                        setTimeout(() => {
                            addNewQuestion();
                        }, 900);
                    } else {
                        wrongAnswers++;
                        wrongSpan.textContent = wrongAnswers;
                        feedbackDiv.innerHTML = '<i class="fas fa-times-circle"></i> خطأ! حاول مرة أخرى';
                        feedbackDiv.classList.remove('correct');
                        feedbackDiv.classList.add('wrong');
                        input.select();
                    }
                }

                submitBtn.addEventListener('click', checkAnswer);
                newBtn.addEventListener('click', () => {
                    // تعطيل الأزرار الحالية
                    input.disabled = true;
                    submitBtn.disabled = true;
                    newBtn.disabled = true;
                    addNewQuestion();
                });

                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        checkAnswer();
                    }
                });
            }

            // زر مسح الأسئلة السابقة
            clearQuestionsBtn.addEventListener('click', () => {
                if (confirm('هل أنت متأكد من مسح جميع الأسئلة السابقة؟')) {
                    questionsStack.innerHTML = '';
                    correctAnswers = 0;
                    wrongAnswers = 0;
                    correctSpan.textContent = '0';
                    wrongSpan.textContent = '0';
                    addNewQuestion();
                }
            });

            // زر عرض الجداول
            showTablesBtn.addEventListener('click', () => {
                tablesSection.classList.toggle('hidden');
                if (!tablesSection.classList.contains('hidden')) {
                    showTablesBtn.innerHTML = '<i class="fas fa-eye-slash"></i> إخفاء الجداول';
                    tablesSection.scrollIntoView({ behavior: 'smooth' });
                } else {
                    showTablesBtn.innerHTML = '<i class="fas fa-table"></i> عرض الجداول كاملة';
                }
            });

            // زر تحميل PDF
            downloadTablesBtn.addEventListener('click', () => {
                tablesSection.classList.remove('hidden');
                window.print();
            });

            // بدء أول سؤال
            addNewQuestion();
        })();
    </script>
</body>
</html>
